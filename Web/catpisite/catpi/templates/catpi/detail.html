{% extends "catpi/base.html" %}
{% load static %}

{% block title %}CATPI{% endblock %}

{% block additional_head_content %}
  <meta name="description" content="CATPI Control for {{ device.device_id }}">
 
{% endblock %}

{% block content %}
    <script type="text/javascript">
        var window_global = {};
        window_global['session_key'] = "{{ request.session.session_key }}";
        window_global['device_id'] = "{{ device.device_id }}";
        window_global['mqtt'] = {'hostname': window.location.hostname,
                                'websockets_port': 50002};
    </script>
        <div id="screen-manager">
        <div id="main-screen" class="screen active">
            <div class="box-layout">
                <div class="thick-bar" id="amount-bar"></div>
                <div class="label" id="auto-label">AUTO: OFF</div>
            </div>
            <div class="button-layout">
                <button id="feed-button" class="circle-button green">FEED</button>
                <button id="auto-button" class="circle-button red">AUTO</button>
                <button id="set-button" class="circle-button yellow">SET</button>
            </div>
        </div>
        <div id="set-time-screen" class="screen">
            <div class="box-layout">
                <div class="label">Set Time</div>
                <select id="breakfast-spinner">
                    <option value="7:00 AM">7:00 AM</option>
                    <option value="7:30 AM">7:30 AM</option>
                    <option value="8:00 AM" selected>8:00 AM</option>
                    <option value="8:30 AM">8:30 AM</option>
                    <option value="9:00 AM">9:00 AM</option>
                    <option value="9:30 AM">9:30 AM</option>
                    <option value="10:00 AM">10:00 AM</option>
                    <option value="10:30 AM">10:30 AM</option>
                </select>
                <select id="lunch-spinner">
                    <option value="11:00 AM">11:00 AM</option>
                    <option value="11:30 AM">11:30 AM</option>
                    <option value="12:00 PM" selected>12:00 PM</option>
                    <option value="12:30 PM">12:30 PM</option>
                    <option value="1:00 PM">1:00 PM</option>
                    <option value="1:30 PM">1:30 PM</option>
                    <option value="2:00 PM">2:00 PM</option>
                    <option value="2:30 PM">2:30 PM</option>
                    <option value="3:00 PM">3:00 PM</option>
                    <option value="3:30 PM">3:30 PM</option>
                </select>
                <select id="dinner-spinner">
                    <option value="4:00 PM">4:00 PM</option>
                    <option value="4:30 PM">4:30 PM</option>
                    <option value="5:00 PM">5:00 PM</option>
                    <option value="5:30 PM">5:30 PM</option>
                    <option value="6:00 PM" selected>6:00 PM</option>
                    <option value="6:30 PM">6:30 PM</option>
                    <option value="7:00 PM">7:00 PM</option>
                    <option value="7:30 PM">7:30 PM</option>
                    <option value="8:00 PM">8:00 PM</option>
                    <option value="8:30 PM">8:30 PM</option>
                    <option value="9:00 PM">9:00 PM</option>
                </select>
                <button id="save-button">Save</button>
            </div>
        </div>
    </div>		

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.2/mqttws31.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.blockUI/2.70/jquery.blockUI.min.js" type="text/javascript"></script>

    <script src="{% static 'catpi/js/catpi.js' %}" type="text/javascript"></script>

{% endblock %}

{% block page_event %}CATPI Detail{% endblock %}
